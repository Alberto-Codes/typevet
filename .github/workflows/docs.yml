---
name: documentation

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --group docs

      - uses: actions/configure-pages@v6.0.0

      # Mermaid 11.17.2 (MIT), dist/mermaid.min.js from jsDelivr. The site
      # serves it locally so Material does not fetch Mermaid from unpkg.
      - name: Vendor pinned Mermaid
        env:
          MERMAID_VERSION: "11.17.2"
          MERMAID_SHA256: "581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8"
          MERMAID_PATH: docs/assets/javascripts/mermaid.min.js
        run: |
          mkdir -p "$(dirname "$MERMAID_PATH")"
          curl -fsSL -o "$MERMAID_PATH" \
            "https://cdn.jsdelivr.net/npm/mermaid@${MERMAID_VERSION}/dist/mermaid.min.js"
          echo "${MERMAID_SHA256}  ${MERMAID_PATH}" | sha256sum -c -

      - name: Build documentation site
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Prune uv cache
        if: always()
        continue-on-error: true
        run: uv cache prune --ci

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5.0.1

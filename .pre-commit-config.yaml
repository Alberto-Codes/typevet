# Commit stage: fast gates. Push stage: coverage floor.
# Every Python tool runs through `uv run` so the lockfile pins one version.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        stages: [pre-commit, pre-push]

      - id: check-suppressions
        name: no gate suppressions
        entry: uv run python scripts/check_suppressions.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: loc-check
        name: file size limit (300 code lines)
        entry: uv run python scripts/check_loc.py src evals/src
        language: system
        pass_filenames: false
        always_run: true

      - id: docvet
        name: docvet check
        entry: uv run docvet check --all
        language: system
        pass_filenames: false
        always_run: true

      # docvet reads one src-root per pyproject.toml; the evals member has its own.
      - id: docvet-evals
        name: docvet check (evals member)
        entry: uv run --directory evals docvet check --all
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (unit + contract)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-cov
        name: pytest with coverage floor
        entry: uv run pytest -q --cov=typevet --cov=typevet_evals --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Native uv audit is experimental; verify flags when upgrading uv.
      - id: dependency-audit
        name: current lockfile dependency audit (uv-secure)
        entry: uv audit --locked --preview-features audit-command
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: prepare-commit-msg-strip-harness-coauthors
        name: strip harness Co-Authored-By
        entry: uv run python scripts/prepare_commit_msg.py
        language: system
        stages: [prepare-commit-msg]

      - id: commit-msg-conventional
        name: Conventional Commits
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

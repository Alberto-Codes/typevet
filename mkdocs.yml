site_name: typevet
site_description: Type-safe structured generation under hexagonal architecture
site_url: https://alberto-codes.github.io/typevet/
repo_url: https://github.com/Alberto-Codes/typevet
repo_name: Alberto-Codes/typevet
edit_uri: blob/main/docs/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips
plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            # Signatures
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            modernize_annotations: true
            line_length: 88
            # Headings
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Members
            members_order: source
            show_category_heading: true
            # Docstrings
            merge_init_into_class: true
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true
extra_css:
  - stylesheets/theme.css
extra_javascript:
  - assets/javascripts/mermaid.min.js
  - javascripts/drawer-keyboard.js
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
exclude_docs: |
  /README.md
  /reference/worker-runs.md
  /maintainers/
validation:
  omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

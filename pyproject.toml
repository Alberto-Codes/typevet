[project]
name = "typevet"
version = "0.5.0"
description = "Typed answers from model next-token probabilities, on llama.cpp and vLLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alberto-Codes", email = "alberto.codes.dev@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "evaluation",
    "gemma",
    "json-schema",
    "llama-cpp",
    "llm",
    "structured-generation",
    "structured-output",
    "type-safe",
    "vllm",
]
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
judgevet = ["judgevet>=0.14,<0.16"]

[project.urls]
Homepage = "https://github.com/Alberto-Codes/typevet"
Documentation = "https://alberto-codes.github.io/typevet/"
Repository = "https://github.com/Alberto-Codes/typevet"
Issues = "https://github.com/Alberto-Codes/typevet/issues"
Changelog = "https://github.com/Alberto-Codes/typevet/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
include = ["src/typevet/py.typed"]

[dependency-groups]
dev = [
    "docvet[griffe]>=1.16.0",
    "import-linter>=2.15",
    "judgevet[mcp,conformance]>=0.15,<0.16",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "typevet-evals",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=12.1",
]

[tool.uv]
# The docs group installs by default: the unit suite builds the site (#241).
default-groups = ["dev", "docs"]

[tool.uv.workspace]
# Evaluation tooling lives in the evals/ member and never ships in the wheel (#256).
members = ["evals"]

[tool.uv.sources]
typevet-evals = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
extend-select = [
    "E402",
    "E501",
    "I",
    "D",
    "B",
    "SIM",
    "UP",
    "RUF",
    "PL",
    "C901",
    "TRY",
    "PERF",
    "S",
    "G",
]
ignore = [
    "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
]
"evals/src/typevet_evals/wheel_isolated.py" = ["S603"]
"scripts/check_commit_msg.py" = ["S603"]
"evals/src/typevet_evals/datasets/partner_guard.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["typevet", "typevet_evals"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals/tests"]
markers = [
    "unit: fast, isolated",
    "contract: adapter behaviour against fakes",
    "live: touches local llama.cpp; never in default CI",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not live",
]

[tool.coverage.run]
source = ["typevet", "typevet_evals"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ty.src]
include = ["src", "tests", "scripts", "evals/src", "evals/tests"]

[tool.importlinter]
root_packages = ["typevet", "typevet_evals"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "typevet.runtime",
    "typevet.adapters.inbound",
    "typevet.adapters.outbound",
    "typevet.adapters.diagnostics",
    "typevet.testing",
    "typevet.ports",
    "typevet.domain",
]

[[tool.importlinter.contracts]]
name = "The library does not import the evals"
type = "forbidden"
source_modules = ["typevet"]
forbidden_modules = ["typevet_evals"]

[[tool.importlinter.contracts]]
# The judgevet bridge (#284) is the one module that may import judgevet.
name = "Only the judgevet bridge imports judgevet"
type = "forbidden"
source_modules = ["typevet", "typevet_evals"]
forbidden_modules = ["judgevet"]
ignore_imports = ["typevet.adapters.inbound.judgevet -> judgevet"]

[[tool.importlinter.contracts]]
# No package init or other module imports the bridge, so bare typevet stays judgevet-free.
name = "No typevet module imports the judgevet bridge"
type = "forbidden"
# Module by module: as packages, typevet.adapters.inbound would contain the bridge and be skipped.
source_modules = ["typevet", "typevet.**", "typevet_evals", "typevet_evals.**"]
forbidden_modules = ["typevet.adapters.inbound.judgevet"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Evaluation families"
type = "layers"
layers = [
    "typevet_evals.cli | typevet_evals.gemma_native_vision_wheel_smoke | typevet_evals.psai_vision_probability_evidence | typevet_evals.wheel_isolated",
    "typevet_evals.throughput",
    "typevet_evals.vllm_acceptance",
    "typevet_evals.instruction_variant | typevet_evals.cord",
    "typevet_evals.psai_vision_consumer | typevet_evals.outcome_replay_metrics",
    "typevet_evals.signature_match | typevet_evals.check_match",
    "typevet_evals.runner | typevet_evals.tpjep | typevet_evals.experiment_identity | typevet_evals.face_match",
    "typevet_evals.datasets | typevet_evals.serving_metrics",
]

[[tool.importlinter.contracts]]
name = "Model framing stays off the serving backends"
type = "forbidden"
source_modules = ["typevet.adapters.outbound.gemma"]
forbidden_modules = [
    "typevet.adapters.outbound.llama_cpp",
    "typevet.adapters.outbound.vllm",
]

[[tool.importlinter.contracts]]
name = "Serving backends stay independent"
type = "independence"
modules = [
    "typevet.adapters.outbound.llama_cpp",
    "typevet.adapters.outbound.vllm",
]

[[tool.importlinter.contracts]]
name = "Fakes stay off the adapters"
type = "forbidden"
source_modules = ["typevet.testing"]
forbidden_modules = ["typevet.adapters"]

[[tool.importlinter.contracts]]
name = "Domain is IO-free"
type = "forbidden"
source_modules = ["typevet.domain"]
forbidden_modules = [
    "json",
    "pathlib",
    "os",
    "io",
    "logging",
    "httpx",
    "typer",
    "jsonschema",
    "structlog",
]

[tool.docvet]
fail-on = ["enrichment", "freshness", "coverage", "griffe", "presence"]
exclude = ["tests", "scripts", "evals/tests"]

[tool.docvet.presence]
min-coverage = 100.0

[tool.typevet.commit-msg]
allowed-authors = [
    "alberto.nieto.80@gmail.com",
    "alberto.codes.dev@gmail.com",
    "github-actions[bot]@users.noreply.github.com",
]
# Commits at or before this SHA on main may keep harness Co-Authored-By; CI warns only.
coauthor-grandfather-through = "1b1d9a3cfde019c5dbfe164c1660f1d3be28b5ba"
